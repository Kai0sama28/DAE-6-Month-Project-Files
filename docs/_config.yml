# Cybersecurity growth highlights (used on the About page)
growth_highlights:
  - title: "SOC & SIEM/XDR"
    detail: "Deploying and validating a Wazuh SIEM/XDR lab for endpoint telemetry, alert triage, and incident response — and layering an AI-agentic workflow on top for alert classification and escalation."
  - title: "Network Security"
    detail: "Designing a routed, two-subnet lab with pfSense firewalling, ACLs, and segmentation, and mapping traffic against the OSI/TCP-IP models to reason about trust boundaries."
  - title: "Threat, Vulnerability & Risk"
    detail: "Running Nmap-based asset discovery and vulnerability assessments, analyzing malware and phishing samples, mapping findings to MITRE ATT&CK, and documenting risk and incident-response steps."

